<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1055" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sweet Pop Crush" />
  <title>Sweet Pop Crush</title>
  <style>
    :root {
      --bg-1: #2b1055;
      --bg-2: #7597de;
      --panel: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.25);
      --text: #ffffff;
      --accent: #ffd166;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #4b1d8c, var(--bg-1) 52%, #132238);
      color: var(--text);
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }

    .game-wrapper {
      width: 100%;
      max-width: min(440px, 100%);
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: clamp(11px, 3.2vw, 16px);
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .title {
      font-size: clamp(1.05rem, 4.2vw, 1.3rem);
      font-weight: 800;
      letter-spacing: 0.3px;
      color: var(--accent);
      line-height: 1.15;
    }

    .level-badge {
      background: rgba(255, 209, 102, 0.22);
      border: 1px solid rgba(255, 209, 102, 0.55);
      color: var(--accent);
      font-size: clamp(0.68rem, 2.5vw, 0.78rem);
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 7px 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: clamp(0.78rem, 3vw, 0.88rem);
      line-height: 1;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .btn-icon.muted {
      opacity: 0.5;
    }

    .btn-restart {
      background: #ff595e;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 7px 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: clamp(0.75rem, 2.8vw, 0.85rem);
      white-space: nowrap;
    }

    .btn-restart:hover {
      filter: brightness(1.08);
    }

    .btn-next {
      background: #06d6a0;
      color: #0b132b;
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-next:hover {
      filter: brightness(1.06);
    }

    .mode-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0, 0, 0, 0.26);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mode-btn {
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      border: none;
      border-radius: 9px;
      padding: 6px 8px;
      font-size: clamp(0.72rem, 2.7vw, 0.8rem);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #1b1130;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(5px, 1.8vw, 8px);
      margin-bottom: 8px;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: clamp(6px, 2vw, 8px);
      text-align: center;
      min-width: 0;
    }

    .stat-label {
      font-size: clamp(0.62rem, 2.2vw, 0.72rem);
      text-transform: uppercase;
      opacity: 0.8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-value {
      font-size: clamp(0.92rem, 3.6vw, 1.1rem);
      font-weight: 800;
      margin-top: 2px;
      white-space: nowrap;
    }

    .progress-wrap {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06d6a0, #ffd166, #ff006e);
      border-radius: 999px;
      transition: width 0.28s ease;
    }

    .board-container {
      position: relative;
      touch-action: none;
      width: 100%;
    }

    .board-container.shake {
      animation: boardShake 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes boardShake {
      0%, 100% { transform: translate3d(0, 0, 0); }
      20% { transform: translate3d(-5px, 2px, 0) rotate(-0.4deg); }
      40% { transform: translate3d(5px, -3px, 0) rotate(0.4deg); }
      60% { transform: translate3d(-4px, -2px, 0) rotate(-0.25deg); }
      80% { transform: translate3d(3px, 2px, 0) rotate(0.25deg); }
    }

    .combo-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: linear-gradient(90deg, #ff006e, #ffbe0b);
      color: #120824;
      font-weight: 900;
      font-size: clamp(0.75rem, 3vw, 0.88rem);
      padding: 5px 14px;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      white-space: nowrap;
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .combo-banner.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: clamp(3px, 1.2vw, 5px);
      background: rgba(15, 10, 30, 0.62);
      padding: clamp(6px, 2vw, 8px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      aspect-ratio: 1 / 1;
      width: 100%;
      max-height: min(68dvh, 424px);
      margin: 0 auto;
      touch-action: none;
      position: relative;
      overflow: hidden;
    }

    .fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      border-radius: 16px;
    }

    .swipe-trail {
      position: absolute;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 209, 102, 0.95), rgba(255, 77, 109, 0.95));
      box-shadow: 0 0 14px rgba(255, 209, 102, 0.95), 0 0 24px rgba(255, 77, 109, 0.65);
      pointer-events: none;
      z-index: 9;
      transform-origin: center center;
    }

    .cell {
      border-radius: clamp(7px, 2.2vw, 10px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, 4.4vw, 1.7rem);
      cursor: pointer;
      touch-action: none;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease, opacity 0.22s ease;
      position: relative;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.28), inset 0 2px 3px rgba(255, 255, 255, 0.25);
      will-change: transform;
      min-width: 0;
      min-height: 0;
    }

    .cell.selected {
      transform: scale(1.1);
      outline: 3px solid #ffffff;
      z-index: 2;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.85);
    }

    .cell.hint {
      animation: hintPulse 0.9s infinite alternate ease-in-out;
      outline: 2px dashed #ffd166;
      z-index: 2;
    }

    @keyframes hintPulse {
      from { transform: scale(1); box-shadow: 0 0 6px rgba(255, 209, 102, 0.5); }
      to { transform: scale(1.09); box-shadow: 0 0 16px rgba(255, 209, 102, 0.95); }
    }

    .cell.swipe-dragging {
      transition: box-shadow 0.1s ease;
      z-index: 5;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45), 0 0 16px rgba(255, 209, 102, 0.9);
    }

    .cell.swipe-target {
      outline: 2.5px solid #ffd166;
      box-shadow: 0 0 14px rgba(255, 209, 102, 0.85);
      transform: scale(0.94);
    }

    .cell.bounce-back {
      animation: elasticBounce 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes elasticBounce {
      0% { transform: scale(1.14); }
      55% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    .cell.matched {
      transform: scale(1.35) rotate(12deg);
      opacity: 0;
      filter: brightness(1.65);
    }

    .cell.striped-h::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      height: 4px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 999px;
      box-shadow: 0 0 8px #fff;
    }

    .cell.striped-v::after {
      content: "";
      position: absolute;
      top: 10%;
      bottom: 10%;
      width: 4px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 999px;
      box-shadow: 0 0 8px #fff;
    }

    .cell.bomb {
      background: radial-gradient(circle, #ffffff 12%, #ff006e 48%, #3a0ca3 100%) !important;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.9);
      animation: pulseBomb 1.1s infinite alternate;
    }

    @keyframes pulseBomb {
      from { transform: scale(0.97); }
      to { transform: scale(1.06); }
    }

    .pop-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: particleBurst 0.52s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes particleBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2);
      }
    }

    .pop-ring {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.9);
      transform: translate(-50%, -50%) scale(0.4);
      animation: ringExpand 0.4s ease-out forwards;
    }

    @keyframes ringExpand {
      0% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(0.4);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.1);
      }
    }

    .floating-score {
      position: absolute;
      font-weight: 900;
      font-size: 0.95rem;
      color: #ffd166;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      transform: translate(-50%, -50%);
      animation: floatScore 0.75s ease-out forwards;
      white-space: nowrap;
    }

    @keyframes floatScore {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.85);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -115%) scale(1.12);
      }
    }

    .c-0 { background: linear-gradient(145deg, #ff4d6d, #c9184a); }
    .c-1 { background: linear-gradient(145deg, #ffbe0b, #fb8500); }
    .c-2 { background: linear-gradient(145deg, #06d6a0, #028090); }
    .c-3 { background: linear-gradient(145deg, #4cc9f0, #3f37c9); }
    .c-4 { background: linear-gradient(145deg, #c77dff, #7209b7); }
    .c-5 { background: linear-gradient(145deg, #ff9f1c, #e71d36); }

    .footer-note {
      margin-top: 10px;
      font-size: clamp(0.74rem, 2.7vw, 0.82rem);
      text-align: center;
      opacity: 0.92;
      min-height: 20px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.74);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }

    .modal.active {
      display: flex;
    }

    .modal-card {
      background: #231942;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: 24px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
    }

    .modal-card h2 {
      margin: 0 0 8px;
      color: var(--accent);
    }

    .modal-card p {
      margin: 0 0 18px;
      opacity: 0.92;
      line-height: 1.45;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 380px) {
      .btn-icon {
        padding: 6px 7px;
      }
      .btn-restart {
        padding: 6px 8px;
      }
    }

    @media (min-width: 768px) {
      .game-wrapper {
        max-width: 450px;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="header">
      <div class="title-group">
        <div class="title">🍬 Sweet Pop Crush</div>
        <div class="level-badge" id="levelBadge">Level 1</div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="musicBtn" title="Toggle Background Music" aria-label="Toggle Background Music">🎵</button>
        <button class="btn-icon" id="soundBtn" title="Toggle Sound Effects" aria-label="Toggle Sound Effects">🔊</button>
        <button class="btn-restart" id="restartBtn">Restart</button>
      </div>
    </div>

    <div class="mode-bar" role="tablist" aria-label="Game Mode">
      <button class="mode-btn active" id="modeMovesBtn" data-mode="moves">🎯 Moves Mode</button>
      <button class="mode-btn" id="modeRushBtn" data-mode="rush">⏱️ 60s Rush Mode</button>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Score / Goal</div>
        <div class="stat-value"><span id="score">0</span> / <span id="goal">1200</span></div>
      </div>
      <div class="stat-box">
        <div class="stat-label" id="limitLabel">Moves Left</div>
        <div class="stat-value" id="limitValue">20</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Best Score</div>
        <div class="stat-value" id="bestScore">0</div>
      </div>
    </div>

    <div class="progress-wrap" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="board-container" id="boardContainer">
      <div class="combo-banner" id="comboBanner">🔥 COMBO x2!</div>
      <div class="board" id="board" aria-label="Match 3 Game Board"></div>
      <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
    </div>

    <div class="footer-note" id="statusText">4 match = Striped • 5 match = 💣 Bomb!</div>
  </div>

  <div class="modal" id="endModal">
    <div class="modal-card">
      <h2 id="modalTitle">Game Over</h2>
      <p id="modalMessage">Aapka final score: 0</p>
      <div class="modal-actions">
        <button class="btn-next" id="modalNextLevel" style="display: none;">Next Level</button>
        <button class="btn-restart" id="modalPlayAgain">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const GRID_SIZE = 8;
    const CANDY_TYPES = [
      { symbol: "🍓", cls: "c-0", color: "#ff4d6d" },
      { symbol: "🍋", cls: "c-1", color: "#ffbe0b" },
      { symbol: "🍏", cls: "c-2", color: "#06d6a0" },
      { symbol: "🫐", cls: "c-3", color: "#4cc9f0" },
      { symbol: "🍇", cls: "c-4", color: "#c77dff" },
      { symbol: "🍊", cls: "c-5", color: "#ff9f1c" }
    ];

    const LEVELS = [
      { level: 1, goal: 1200, moves: 20, rushSeconds: 60 },
      { level: 2, goal: 2400, moves: 22, rushSeconds: 60 },
      { level: 3, goal: 3800, moves: 24, rushSeconds: 55 },
      { level: 4, goal: 5500, moves: 26, rushSeconds: 55 },
      { level: 5, goal: 7500, moves: 28, rushSeconds: 50 }
    ];

    function getLevelConfig(lvl) {
      if (lvl <= LEVELS.length) return LEVELS[lvl - 1];
      const extra = lvl - LEVELS.length;
      return {
        level: lvl,
        goal: 7500 + extra * 2500,
        moves: 28 + Math.min(8, extra * 2),
        rushSeconds: Math.max(40, 50 - extra * 2)
      };
    }

    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.sfxMuted = false;
        this.musicMuted = false;
        this.musicTimer = null;
        this.stepIdx = 0;
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      startMusic() {
        if (this.musicMuted || this.musicTimer) return;
        const ctx = this.ensureContext();
        if (!ctx) return;

        const melody = [
          523.25, 659.25, 783.99, 659.25,
          587.33, 783.99, 880.00, 783.99,
          659.25, 783.99, 1046.50, 783.99,
          587.33, 659.25, 523.25, 392.00
        ];

        this.musicTimer = setInterval(() => {
          if (this.musicMuted || !this.ctx || this.ctx.state !== "running") return;
          const now = this.ctx.currentTime;
          const freq = melody[this.stepIdx % melody.length];
          this.stepIdx++;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.025, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.24);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        }, 260);
      }

      stopMusic() {
        if (this.musicTimer) {
          clearInterval(this.musicTimer);
          this.musicTimer = null;
        }
      }

      toggleMusic() {
        this.musicMuted = !this.musicMuted;
        if (this.musicMuted) {
          this.stopMusic();
        } else {
          this.ensureContext();
          this.startMusic();
        }
        return !this.musicMuted;
      }

      toggleSfx() {
        this.sfxMuted = !this.sfxMuted;
        return !this.sfxMuted;
      }

      playSwipe() {
        if (this.sfxMuted) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.09);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      playInvalid() {
        if (this.sfxMuted) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(125, now + 0.14);

        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }

      playPop(combo = 1) {
        if (this.sfxMuted) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const baseFreq = Math.min(1040, 420 + (combo - 1) * 95);

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + 0.11);

        gain.gain.setValueAtTime(0.13, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }

      playSpecialBlast() {
        if (this.sfxMuted) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.22);

        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }

      playWin() {
        if (this.sfxMuted) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const now = ctx.currentTime + idx * 0.09;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        });
      }

      playLose() {
        if (this.sfxMuted) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const notes = [392.0, 349.23, 311.13, 261.63];
        notes.forEach((freq, idx) => {
          const now = ctx.currentTime + idx * 0.12;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        });
      }
    }

    function loadBestScore() {
      try {
        const val = Number(localStorage.getItem("sweetPopCrushBest") || 0);
        return Number.isFinite(val) && val >= 0 ? Math.floor(val) : 0;
      } catch {
        return 0;
      }
    }

    function saveBestScore(val) {
      try {
        localStorage.setItem("sweetPopCrushBest", String(Math.floor(val)));
      } catch {}
    }

    function randomCandyType() {
      return Math.floor(Math.random() * CANDY_TYPES.length);
    }

    function makeCell(type = randomCandyType(), special = null) {
      return { type, special };
    }

    function cloneCell(cell) {
      return cell ? { type: cell.type, special: cell.special } : null;
    }

    function swapCells(a, b) {
      const temp = board[a.r][a.c];
      board[a.r][a.c] = board[b.r][b.c];
      board[b.r][b.c] = temp;
    }

    function isAdjacent(a, b) {
      return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
    }

    function fillBoardWithoutMatches() {
      board = Array.from({ length: GRID_SIZE }, () =>
        Array.from({ length: GRID_SIZE }, () => makeCell(randomCandyType(), null))
      );

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          let guard = 0;
          while (
            guard < 30 &&
            ((c >= 2 &&
              board[r][c].type === board[r][c - 1].type &&
              board[r][c].type === board[r][c - 2].type) ||
             (r >= 2 &&
              board[r][c].type === board[r - 1][c].type &&
              board[r][c].type === board[r - 2][c].type))
          ) {
            board[r][c].type = randomCandyType();
            guard++;
          }
        }
      }
    }

    function createInitialBoard() {
      let attempts = 0;
      do {
        fillBoardWithoutMatches();
        attempts++;
      } while (!findFirstValidMove() && attempts < 25);
    }

    function findMatchGroups() {
      const groups = [];

      for (let r = 0; r < GRID_SIZE; r++) {
        let c = 0;
        while (c < GRID_SIZE) {
          const base = board[r][c];
          if (!base || base.special === "bomb") {
            c++;
            continue;
          }
          let end = c + 1;
          while (
            end < GRID_SIZE &&
            board[r][end] &&
            board[r][end].special !== "bomb" &&
            board[r][end].type === base.type
          ) {
            end++;
          }
          const len = end - c;
          if (len >= 3) {
            const cells = [];
            for (let k = c; k < end; k++) cells.push({ r, c: k });
            groups.push({ orientation: "h", type: base.type, length: len, cells });
          }
          c = end;
        }
      }

      for (let c = 0; c < GRID_SIZE; c++) {
        let r = 0;
        while (r < GRID_SIZE) {
          const base = board[r][c];
          if (!base || base.special === "bomb") {
            r++;
            continue;
          }
          let end = r + 1;
          while (
            end < GRID_SIZE &&
            board[end][c] &&
            board[end][c].special !== "bomb" &&
            board[end][c].type === base.type
          ) {
            end++;
          }
          const len = end - r;
          if (len >= 3) {
            const cells = [];
            for (let k = r; k < end; k++) cells.push({ r: k, c });
            groups.push({ orientation: "v", type: base.type, length: len, cells });
          }
          r = end;
        }
      }

      return { groups };
    }

    function findFirstValidMove() {
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cellA = board[r][c];
          if (!cellA) continue;

          if (c + 1 < GRID_SIZE && board[r][c + 1]) {
            const cellB = board[r][c + 1];
            if (cellA.special === "bomb" || cellB.special === "bomb") {
              return [{ r, c }, { r, c: c + 1 }];
            }
            swapCells({ r, c }, { r, c: c + 1 });
            const hasMatch = findMatchGroups().groups.length > 0;
            swapCells({ r, c }, { r, c: c + 1 });
            if (hasMatch) return [{ r, c }, { r, c: c + 1 }];
          }

          if (r + 1 < GRID_SIZE && board[r + 1][c]) {
            const cellB = board[r + 1][c];
            if (cellA.special === "bomb" || cellB.special === "bomb") {
              return [{ r, c }, { r: r + 1, c }];
            }
            swapCells({ r, c }, { r: r + 1, c });
            const hasMatch = findMatchGroups().groups.length > 0;
            swapCells({ r, c }, { r: r + 1, c });
            if (hasMatch) return [{ r, c }, { r: r + 1, c }];
          }
        }
      }
      return null;
    }

    function shuffleBoard() {
      const pool = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (board[r][c]) pool.push(cloneCell(board[r][c]));
        }
      }
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      let idx = 0;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          board[r][c] = pool[idx++];
        }
      }
      if (!findFirstValidMove()) {
        createInitialBoard();
      }
      renderBoard();
      showComboBanner("🔀 NO MOVES — SHUFFLED!");
      statusTextEl.textContent = "Naye moves ke saath board shuffle ho gaya!";
    }

    function clearHint() {
      if (hintCells.length > 0) {
        hintCells = [];
        renderBoard();

    function resetIdleTimer() {
      clearTimeout(idleTimer);

      idleTimer = setTimeout(() => {

        }

    function renderSwipeTrail() {
      fxLayerEl.querySelectorAll(".swipe-trail").forEach((el) => el.remove());
      if (!dragState || !dragState.moved || !dragState.targetPos) return;

      const boardRect = boardEl.getBoundingClientRect();
      if (!boardRect.width || !boardRect.height) return;

      const cellW = boardRect.width / GRID_SIZE;
      const cellH = boardRect.height / GRID_SIZE;

      const x1 = (dragState.c + 0.5) * cellW;
      const y1 = (dragState.r + 0.5) * cellH;
      const x2 = (dragState.targetPos.c + 0.5) * cellW;
      const y2 = (dragState.targetPos.r + 0.5) * cellH;

      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.hypot(dx, dy);
      const angle = (Math.atan2(dy, dx) * 180) / Math.PI;

      const trail = document.createElement("div");
      trail.className = "swipe-trail";
      trail.style.width = `${Math.max(12, length)}px`;
      trail.style.height = "8px";
      trail.style.left = `${(x1 + x2) / 2 - Math.max(12, length) / 2}px`;
      trail.style.top = `${(y1 + y2) / 2 - 4}px`;
      trail.style.transform = `rotate(${angle}deg)`;
      fxLayerEl.appendChild(trail);
    }

    function spawnPopEffects(matchedSet, pointsEarned) {
      if (!matchedSet || matchedSet.size === 0) return;

      const boardRect = boardEl.getBoundingClientRect();
      if (!boardRect.width || !boardRect.height) return;

      const cellW = boardRect.width / GRID_SIZE;
      const cellH = boardRect.height / GRID_SIZE;

      let sumX = 0;
      let sumY = 0;
      let count = 0;

      matchedSet.forEach((key) => {
        const [r, c] = key.split(",").map(Number);
        const cx = (c + 0.5) * cellW;
        const cy = (r + 0.5) * cellH;
        sumX += cx;
        sumY += cy;
        count++;

        const cellData = board[r]?.[c];
        const color =
          cellData && cellData.special === "bomb"
            ? "#ffd166"
            : (CANDY_TYPES[cellData?.type] || CANDY_TYPES[0]).color;

        const ring = document.createElement("div");
        ring.className = "pop-ring";
        ring.style.left = `${cx}px`;
        ring.style.top = `${cy}px`;
        ring.style.borderColor = color;
        fxLayerEl.appendChild(ring);
        setTimeout(() => ring.remove(), 420);

        const particleCount = 6;
        for (let i = 0; i < particleCount; i++) {
          const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.4;
          const dist = 18 + Math.random() * 18;
          const dx = `${Math.cos(angle) * dist}px`;
          const dy = `${Math.sin(angle) * dist}px`;

          const dot = document.createElement("div");
          dot.className = "pop-particle";
          dot.style.left = `${cx}px`;
          dot.style.top = `${cy}px`;
          dot.style.background = color;
          dot.style.boxShadow = `0 0 8px ${color}`;
          dot.style.setProperty("--dx", dx);
          dot.style.setProperty("--dy", dy);
          fxLayerEl.appendChild(dot);
          setTimeout(() => dot.remove(), 550);
        }
      });

      if (count > 0 && pointsEarned > 0) {
        const avgX = Math.max(36, Math.min(boardRect.width - 36, sumX / count));
        const avgY = Math.max(28, Math.min(boardRect.height - 20, sumY / count));
        const tag = document.createElement("div");
        tag.className = "floating-score";
        tag.style.left = `${avgX}px`;
        tag.style.top = `${avgY}px`;
        tag.textContent = `+${pointsEarned}`;
        fxLayerEl.appendChild(tag);
        setTimeout(() => tag.remove(), 780);
      }
    }

    function renderBoard(matchedSet = new Set()) {
      boardEl.innerHTML = "";
      fxLayerEl.querySelectorAll(".swipe-trail").forEach((el) => el.remove());

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cellData = board[r][c];
          const cellEl = document.createElement("div");
          cellEl.className = "cell";
          cellEl.dataset.r = String(r);
          cellEl.dataset.c = String(c);

          const key = `${r},${c}`;
          if (cellData) {
            const candy = CANDY_TYPES[cellData.type] || CANDY_TYPES[0];
            cellEl.classList.add(candy.cls);

            if (cellData.special === "bomb") {
              cellEl.classList.add("bomb");
              cellEl.textContent = "💣";
            } else {
              cellEl.textContent = candy.symbol;
              if (cellData.special === "striped-h") cellEl.classList.add("striped-h");
              if (cellData.special === "striped-v") cellEl.classList.add("striped-v");
            }
          }

          if (selected && selected.r === r && selected.c === c) {
            cellEl.classList.add("selected");
          }

          if (dragState && dragState.r === r && dragState.c === c && dragState.moved) {
            cellEl.classList.add("swipe-dragging");
            cellEl.style.transform = `translate3d(${dragState.dx}px, ${dragState.dy}px, 0) scale(1.12)`;
          }

          if (dragState && dragState.targetPos && dragState.targetPos.r === r && dragState.targetPos.c === c) {
            cellEl.classList.add("swipe-target");
          }

          if (bounceKeys.has(key)) {
            cellEl.classList.add("bounce-back");
          }

          if (hintCells.some((h) => h.r === r && h.c === c)) {
            cellEl.classList.add("hint");
          }

          if (matchedSet.has(key)) {
            cellEl.classList.add("matched");
          }

          cellEl.addEventListener("pointerdown", onCellPointerDown);
          boardEl.appendChild(cellEl);
        }
      }

      if (bounceKeys.size > 0) {
        const keysSnapshot = new Set(bounceKeys);
        bounceKeys.clear();
        setTimeout(() => {
          keysSnapshot.forEach((k) => {
            const [br, bc] = k.split(",").map(Number);
            const target = boardEl.querySelector(`.cell[data-r="${br}"][data-c="${bc}"]`);
            if (target) target.classList.remove("bounce-back");
          });
        }, 300);
      }

      renderSwipeTrail();
    }

    function expandSpecials(initialSet) {
      const toClear = new Set(initialSet);
      const queue = Array.from(initialSet);
      const visitedSpecials = new Set();
      let triggeredSpecial = false;

      while (queue.length > 0) {
        const key = queue.shift();
        const [r, c] = key.split(",").map(Number);
        const cell = board[r]?.[c];
        if (!cell || !cell.special || visitedSpecials.has(key)) continue;

        visitedSpecials.add(key);
        triggeredSpecial = true;

        if (cell.special === "striped-h") {
          for (let col = 0; col < GRID_SIZE; col++) {
            const k = `${r},${col}`;
            if (!toClear.has(k)) {
              toClear.add(k);
              queue.push(k);
            }
          }
        } else if (cell.special === "striped-v") {
          for (let row = 0; row < GRID_SIZE; row++) {
            const k = `${row},${c}`;
            if (!toClear.has(k)) {
              toClear.add(k);
              queue.push(k);
            }
          }
        } else if (cell.special === "bomb") {
          const targetType = cell.type;
          for (let row = 0; row < GRID_SIZE; row++) {
            for (let col = 0; col < GRID_SIZE; col++) {
              const other = board[row][col];
              if (other && other.type === targetType) {
                const k = `${row},${col}`;
                if (!toClear.has(k)) {
                  toClear.add(k);
                  queue.push(k);
                }
              }
            }
          }
        }
      }

      return { toClear, triggeredSpecial };
    }

    function triggerBombWithTarget(bombPos, otherPos) {
      const bombCell = board[bombPos.r]?.[bombPos.c];
      const otherCell = board[otherPos.r]?.[otherPos.c];
      if (!bombCell || bombCell.special !== "bomb") return null;

      const set = new Set([`${bombPos.r},${bombPos.c}`]);
      if (otherCell && otherCell.special === "bomb") {
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            set.add(`${r},${c}`);
          }
        }
      } else {
        const targetType = otherCell ? otherCell.type : bombCell.type;
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (board[r][c] && board[r][c].type === targetType) {
              set.add(`${r},${c}`);
            }
          }
        }
      }
      return expandSpecials(set).toClear;
    }

    function dropAndRefillBoard() {
      for (let c = 0; c < GRID_SIZE; c++) {
        let writeRow = GRID_SIZE - 1;
        for (let r = GRID_SIZE - 1; r >= 0; r--) {
          if (board[r][c] !== null) {
            if (writeRow !== r) {
              board[writeRow][c] = board[r][c];
              board[r][c] = null;
            }
            writeRow--;
          }
        }
        for (let r = writeRow; r >= 0; r--) {
          board[r][c] = makeCell(randomCandyType(), null);
        }
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function resolveMatches(preferredPos = null, customSet = null) {
      let combo = 0;

      while (true) {
        let matchedSet = null;
        let createdSpecials = [];

        if (combo === 0 && customSet && customSet.size > 0) {
          matchedSet = customSet;
        } else {
          const { groups } = findMatchGroups();
          if (groups.length === 0) break;

          matchedSet = new Set();
          for (const g of groups) {
            for (const pt of g.cells) {
              matchedSet.add(`${pt.r},${pt.c}`);
            }

            if (g.length >= 4) {
              let anchor = g.cells[Math.floor(g.cells.length / 2)];
              if (preferredPos) {
                const hit = g.cells.find((pt) => pt.r === preferredPos.r && pt.c === preferredPos.c);
                if (hit) anchor = hit;
              }
              const specialKind =
                g.length >= 5
                  ? "bomb"
                  : g.orientation === "h"
                  ? "striped-v"
                  : "striped-h";
              createdSpecials.push({
                r: anchor.r,
                c: anchor.c,
                type: g.type,
                special: specialKind
              });
            }
          }
        }

        combo++;
        const expanded = expandSpecials(matchedSet);
        const finalSet = expanded.toClear;

        const basePoints = finalSet.size * 50;
        const comboBonus = combo > 1 ? (combo - 1) * 120 : 0;
        const earned = basePoints + comboBonus;
        score += earned;

        if (gameMode === "rush" && combo >= 2) {
          timeLeft += 2;
          statusTextEl.textContent = `⚡ Combo x${combo}! +2s bonus time & +${earned} pts!`;
        } else if (combo > 1) {
          statusTextEl.textContent = `🔥 Chain Combo x${combo}! +${earned} points!`;
        } else {
          statusTextEl.textContent = `🍬 Sweet pop! +${earned} points!`;
        }

        updateHUD();

        if (combo >= 2 || expanded.triggeredSpecial || finalSet.size >= 4) {
          triggerScreenShake();
          audio.playSpecialBlast();
          showComboBanner(
            expanded.triggeredSpecial
              ? `💥 SPECIAL BLAST x${combo}!`
              : `🔥 COMBO x${combo}!`
          );
        } else {
          audio.playPop(combo);
        }

        spawnPopEffects(finalSet, earned);
        renderBoard(finalSet);
        await sleep(250);

        finalSet.forEach((key) => {
          const [r, c] = key.split(",").map(Number);
          board[r][c] = null;
        });

        for (const sp of createdSpecials) {
          if (board[sp.r]?.[sp.c] === null) {
            board[sp.r][sp.c] = makeCell(sp.type, sp.special);
          }
        }

        dropAndRefillBoard();
        renderBoard();
        await sleep(210);
      }

      if (!findFirstValidMove()) {
        shuffleBoard();
      }
    }

    async function attemptSwap(posA, posB) {
      if (isBusy || !isAdjacent(posA, posB)) return;
      const cellA = board[posA.r]?.[posA.c];
      const cellB = board[posB.r]?.[posB.c];
      if (!cellA || !cellB) return;

      isBusy = true;
      clearTimeout(idleTimer);
      clearHint();
      selected = null;

      swapCells(posA, posB);
      renderBoard();
      audio.playSwipe();
      await sleep(140);

      let bombSet = null;
      if (cellA.special === "bomb") {
        bombSet = triggerBombWithTarget(posB, posA);
      } else if (cellB.special === "bomb") {
        bombSet = triggerBombWithTarget(posA, posB);
      }

      const hasNormalMatch = findMatchGroups().groups.length > 0;

      if (!bombSet && !hasNormalMatch) {
        swapCells(posA, posB);
        bounceKeys.add(`${posA.r},${posA.c}`);
        bounceKeys.add(`${posB.r},${posB.c}`);
        audio.playInvalid();
        statusTextEl.textContent = "Is swap se match nahi bana!";
        renderBoard();
        await sleep(260);
        isBusy = false;
        resetIdleTimer();
        return;
      }

      if (gameMode === "moves") {
        moves = Math.max(0, moves - 1);
        updateHUD();
      }

      await resolveMatches(posB, bombSet);

      isBusy = false;
      checkEndCondition();
      if (!endModalEl.classList.contains("active")) {
        resetIdleTimer();
      }
    }

    function onCellPointerDown(e) {
      if (isBusy || endModalEl.classList.contains("active")) return;
      audio.ensureContext();
      audio.startMusic();
      resetIdleTimer();

      const cellEl = e.currentTarget;
      const r = Number(cellEl.dataset.r);
      const c = Number(cellEl.dataset.c);
      if (Number.isNaN(r) || Number.isNaN(c)) return;

      const cellRect = cellEl.getBoundingClientRect();
      dragState = {
        pointerId: e.pointerId,
        r,
        c,
        startX: e.clientX,
        startY: e.clientY,
        dx: 0,
        dy: 0,
        moved: false,
        threshold: Math.max(16, cellRect.width * 0.34),
        targetPos: null
      };

      try {
        cellEl.setPointerCapture(e.pointerId);
      } catch {}

      cellEl.addEventListener("pointermove", onCellPointerMove);
      cellEl.addEventListener("pointerup", onCellPointerUp);
      cellEl.addEventListener("pointercancel", onCellPointerUp);
    }

    function onCellPointerMove(e) {
      if (!dragState || e.pointerId !== dragState.pointerId || isBusy) return;

      const rawDx = e.clientX - dragState.startX;
      const rawDy = e.clientY - dragState.startY;
      const maxOffset = dragState.threshold * 1.15;

      if (Math.hypot(rawDx, rawDy) > 6) {
        dragState.moved = true;
      }

      if (Math.abs(rawDx) >= Math.abs(rawDy)) {
        const clampedX = Math.max(-maxOffset, Math.min(maxOffset, rawDx));
        dragState.dx = clampedX;
        dragState.dy = rawDy * 0.25;
        if (Math.abs(rawDx) >= dragState.threshold) {
          const nc = dragState.c + (rawDx > 0 ? 1 : -1);
          dragState.targetPos = nc >= 0 && nc < GRID_SIZE ? { r: dragState.r, c: nc } : null;
        } else {
          dragState.targetPos = null;
        }
      } else {
        const clampedY = Math.max(-maxOffset, Math.min(maxOffset, rawDy));
        dragState.dy = clampedY;
        dragState.dx = rawDx * 0.25;
        if (Math.abs(rawDy) >= dragState.threshold) {
          const nr = dragState.r + (rawDy > 0 ? 1 : -1);
          dragState.targetPos = nr >= 0 && nr < GRID_SIZE ? { r: nr, c: dragState.c } : null;
        } else {
          dragState.targetPos = null;
        }
      }

      renderBoard();
    }

    function cleanupPointerListeners(el) {
      el.removeEventListener("pointermove", onCellPointerMove);
      el.removeEventListener("pointerup", onCellPointerUp);
      el.removeEventListener("pointercancel", onCellPointerUp);
    }

    async function onCellPointerUp(e) {
      const cellEl = e.currentTarget;
      cleanupPointerListeners(cellEl);

      if (!dragState || e.pointerId !== dragState.pointerId) return;
      const currentDrag = dragState;
      dragState = null;

      if (currentDrag.moved && currentDrag.targetPos) {
        await attemptSwap({ r: currentDrag.r, c: currentDrag.c }, currentDrag.targetPos);
        return;
      }

      renderBoard();

      const clicked = { r: currentDrag.r, c: currentDrag.c };
      if (!selected) {
        selected = clicked;
        renderBoard();
        return;
      }

      if (selected.r === clicked.r && selected.c === clicked.c) {
        selected = null;
        renderBoard();
        return;
      }

      if (isAdjacent(selected, clicked)) {
        const prev = selected;
        await attemptSwap(prev, clicked);
      } else {
        selected = clicked;
        renderBoard();
      }
    }

    function stopRushTimer() {
      if (rushTimer) {
        clearInterval(rushTimer);
        rushTimer = null;
      }
    }

    function startRushTimer() {
      stopRushTimer();
      if (gameMode !== "rush") return;

      rushTimer = setInterval(() => {
        if (endModalEl.classList.contains("active")) return;
        if (isBusy) return;

        timeLeft = Math.max(0, timeLeft - 1);
        updateHUD();

        if (timeLeft <= 0) {
          stopRushTimer();
          checkEndCondition();
        }
      }, 1000);
    }

    function openModal(won) {
      stopRushTimer();
      clearTimeout(idleTimer);
      clearHint();

      if (won) {
        audio.playWin();
        modalTitleEl.textContent = `🎉 Level ${currentLevel} Cleared!`;
        modalMessageEl.textContent = `Shandaar! Aapne ${score} score banaya (Goal: ${targetScore}).`;
        modalNextLevelBtn.style.display = "inline-block";
      } else {
        audio.playLose();
        modalTitleEl.textContent = gameMode === "rush" ? "⏱️ Time's Up!" : "Moves Khatam!";
        modalMessageEl.textContent = `Final Score: ${score} / Goal: ${targetScore}. Dobara koshish karein!`;
        modalNextLevelBtn.style.display = "none";
      }

      endModalEl.classList.add("active");
    }

    function checkEndCondition() {
      if (endModalEl.classList.contains("active")) return;

      if (score >= targetScore) {
        openModal(true);
        return;
      }

      if (gameMode === "moves" && moves <= 0) {
        openModal(false);
      } else if (gameMode === "rush" && timeLeft <= 0) {
        openModal(false);
      }
    }

    function startLevel(lvl, resetTotalScore = false) {
      currentLevel = Math.max(1, lvl);
      const cfg = getLevelConfig(currentLevel);
      targetScore = cfg.goal;
      moves = cfg.moves;
      timeLeft = cfg.rushSeconds;

      if (resetTotalScore || currentLevel === 1) {
        score = 0;
      }

      selected = null;
      dragState = null;
      bounceKeys.clear();
      hintCells = [];
      isBusy = false;
      endModalEl.classList.remove("active");

      createInitialBoard();
      updateHUD();
      renderBoard();
      startRushTimer();
      resetIdleTimer();

      statusTextEl.textContent =
        gameMode === "rush"
          ? `⏱️ Level ${currentLevel}: ${timeLeft}s mein ${targetScore} score banayein!`
          : `🎯 Level ${currentLevel}: ${moves} moves mein ${targetScore} score banayein!`;
    }

    function setGameMode(mode) {
      if (mode !== "moves" && mode !== "rush") return;
      gameMode = mode;
      modeMovesBtnEl.classList.toggle("active", mode === "moves");
      modeRushBtnEl.classList.toggle("active", mode === "rush");
      startLevel(1, true);
    }

    musicBtnEl.addEventListener("click", () => {
      const isOn = audio.toggleMusic();
      musicBtnEl.classList.toggle("muted", !isOn);
      musicBtnEl.textContent = isOn ? "🎵" : "🔇";
    });

    soundBtnEl.addEventListener("click", () => {
      const isOn = audio.toggleSfx();
      soundBtnEl.classList.toggle("muted", !isOn);
      soundBtnEl.textContent = isOn ? "🔊" : "🔈";
    });

    modeMovesBtnEl.addEventListener("click", () => setGameMode("moves"));
    modeRushBtnEl.addEventListener("click", () => setGameMode("rush"));

    document.getElementById("restartBtn").addEventListener("click", () => {
      startLevel(currentLevel, true);
    });

    modalNextLevelBtn.addEventListener("click", () => {
      startLevel(currentLevel + 1, false);
    });

    modalPlayAgainBtn.addEventListener("click", () => {
      startLevel(currentLevel, true);
    });

    startLevel(1, true);
  </script>
</body>
</html>
